<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clínica Saúde</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>

    <div class="container-fluid col-lg-3 col-md-6 col-sm-10 " id="login-screen">
        <div class="login-form card">
            <div class="card-body">
                <div class="card-header bg-success text-white">
                    <h2>Clínica Saúde</h2>
                    <p>Sua saúde em primeiro lugar</p>
                </div>
                <!-- Formulário de login -->
                <form action="#" method="#">
                    <div class="mb-3 form-group mt-3">
                        <input type="email" class="form-control mb-3" id="email" placeholder="Email">
                        <input type="password" class="form-control" id="password" placeholder="Senha">
                    </div>
                    <button type="submit" class="btn btn-success"><a href="views/viewMedico.html">Entrar</a></button>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="scripts/script.js"></script>
</body>
</html>
