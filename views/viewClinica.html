<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clínica Saúde</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="../styles/style.css">
</head>
<body>

    
  <!-- Tela menu inicial da clinica-->
  <div class="container-fluid col-lg-3 col-md-6 col-sm-10" id="login-screen">
    <div class="login-form card">
        <div class="card-body">
            <div class="card-header bg-success text-white">
                <h2>Clínica Saúde</h2>
                <p>Sua saúde em primeiro lugar</p>
            </div>
            <div class="menu">
              <div>
                  <button class="btn btn-success text-white mt-3" >
                    <a href="#">
                      <i class="fa-solid fa-group-doctor"></i>Gerenciar membros
                    </a>
                  </button> 
                  
                  <button class="btn btn-success text-white mt-3"  onclick="showhideview('cadastro_medico')">
                    <a href="#">
                      <i class="fa-solid fa-calendar-days"></i> Cadastrar membros
                    </a>
                  </button>

                  <button class="btn btn-success text-white mt-3">
                    <a href="#">
                      <i class="fa-solid fa-calendar-days"></i> Relatorio de faltas
                    </a>
                  </button>
              </div>
            </div>
        </div>
    </div>
  </div>



<!-- Tela cadastro de medicos-->
  <div class="container-fluid col-lg-4 col-md-6 col-sm-10 d-none" id="cadastro_medico">
    <div class="login-form card">
        <div class="card-body">
            <div class="card-header bg-success text-white">
                <h2>Clínica Saúde</h2>
                <p>Sua saúde em primeiro lugar</p>
            </div>
            <div class="menu">
                <h3 class="mt-3 col-12 text-center">Cadastro de medicos</h3>
                <form action="#" method="#" class="form-control">
                    <label for="nome-completo">Nome Completo:</label>
                    <input type="text" class="form-control border border-secondary" id="nome-completo" name="nome-completo" required>
                
                    <label for="crm">CRM:</label>
                    <input type="text" class="form-control border border-secondary" id="crm" name="crm" required>
                
                    <label for="rqe">RQE:</label>
                    <input type="text" class="form-control border border-secondary" id="rqe" name="rqe" required>
                
                    <label for="especialidade">Especialidade:</label>
                    <input type="text" class="form-control border border-secondary" id="especialidade" name="especialidade" required>
                
                    <label for="subespecialidade">Subespecialidade:</label>
                    <input type="text" class="form-control border border-secondary" id="subespecialidade" name="subespecialidade">
                
                    <label for="endereco">Endereço:</label>
                    <input type="text" class="form-control border border-secondary" id="endereco" name="endereco" required>
                
                    <label for="login">Login:</label>
                    <input type="text" class="form-control border border-secondary" id="login" name="login" required>
                
                    <label for="senha">Senha:</label>
                    <input type="password" class="form-control border border-secondary" id="senha" name="senha" required>
                
                    <button type="submit" class="btn btn-success mt-3">Cadastrar</button>
                </form>
            </div>
        </div>
    </div>
</div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../scripts/script.js"></script>
</body>
</html>
